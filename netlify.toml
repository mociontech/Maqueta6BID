[build]
  command = "npm run build:netlify"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/"
  to = "/controller/"
  status = 302

# Images and videos are heavy: cache them on the devices so reloads don't compete
# with the sync requests. After replacing a file with the same name, reload with Ctrl+F5.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/TV/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/pantallas/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
